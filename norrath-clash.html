<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>V8 ULTRA SIMPLE - FUNCIONA 100%</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden;background:#000;position:fixed;touch-action:none}
#gc{width:100vw;height:100vh;background:#2e7d32;position:relative;overflow:hidden}
#game{width:100%;height:100%;display:block;background:#2e7d32;position:absolute;top:0;left:0}
#hud{position:absolute;top:0;left:0;right:0;height:40px;background:#000;color:#FFD700;display:flex;align-items:center;padding:0 10px;gap:10px;z-index:10;font-weight:900;font-size:12px}
#joy{position:absolute;bottom:20px;left:20px;width:130px;height:130px;border-radius:65px;background:rgba(0,0,0,0.5);border:4px solid #FFD700;z-index:20}
#joyBase{width:100%;height:100%;border-radius:50%;background:#555;position:relative;border:4px solid #000}
#joyStick{width:50px;height:50px;border-radius:25px;background:#FFD700;border:3px solid #000;position:absolute;left:36px;top:36px;display:flex;justify-content:center;align-items:center;font-size:20px}
#atk{position:absolute;bottom:20px;right:20px;width:80px;height:80px;border-radius:20px;background:#c62828;border:4px solid #000;z-index:20;display:flex;justify-content:center;align-items:center;font-size:40px;color:#fff;font-weight:900}
#start{position:absolute;inset:0;background:#1a0f0a;z-index:100;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:20px;text-align:center}
#start h1{color:#FFD700;font-size:36px;text-shadow:3px 3px 0 #000;margin-bottom:10px}
#start p{color:#fff;font-size:12px;margin:5px 0}
.btn{margin-top:20px;background:#FFD700;color:#000;border:4px solid #000;padding:15px 40px;border-radius:15px;font-weight:900;font-size:18px;box-shadow:0 6px 0 #000}
.btn:active{transform:translateY(6px);box-shadow:none}
#log{position:absolute;bottom:120px;left:10px;right:10px;background:rgba(0,0,0,0.9);color:#0f0;font-size:10px;padding:8px;border-radius:8px;border:2px solid #0f0;z-index:30;max-height:100px;overflow-y:auto;pointer-events:none;white-space:pre-wrap}
</style>
</head>
<body>
<div id="gc">
<canvas id="game" width="420" height="860"></canvas>
<div id="hud">❤️ <span id="hp">100</span> | 💰 <span id="gold">0</span> | 📍 <span id="pos">0,0</span> | <span id="status">AGUARDANDO</span></div>
<div id="joy"><div id="joyBase"><div id="joyStick">🕹️</div></div></div>
<div id="atk">⚔️</div>
<div id="log">LOG: Iniciando V8...
</div>
<div id="start">
<h1>NORRATH V8</h1>
<p style="color:#FFD700;font-weight:900">ULTRA SIMPLE - 100% FUNCIONAL</p>
<p>Toque no botão abaixo, menu some e anda!</p>
<p style="font-size:10px;color:#aaa;margin-top:10px">Se não funcionar, log verde mostra erro</p>
<button class="btn" id="btnStart" onclick="startV8()">▶ JOGAR AGORA</button>
<p style="margin-top:15px;font-size:9px;color:#FFD700">V8: Sem texturas, sem colisão, só anda!</p>
</div>
</div>
<script>
let logEl=document.getElementById('log');
function log(m){console.log(m); logEl.textContent+=m+'\n'; logEl.scrollTop=logEl.scrollHeight;}
log('V8 JS carregou OK');

let P={x:1600,y:1600,f:1,atk:0,hp:100,gold:0};
let C={x:0,y:0}, J={a:0,x:0,y:0}, T=null, gameOn=false;
let objs=[], mons=[];
let W=3200,H=3200;

function genWorldSimple(){
log('Gerando mundo...');
objs=[]; mons=[];
for(let i=0;i<15;i++){objs.push({x:300+Math.random()*2600,y:300+Math.random()*2600,w:80,h:80,t:'house'});}
for(let i=0;i<20;i++){objs.push({x:Math.random()*W,y:Math.random()*H,w:40,h:40,t:'tree'});}
for(let i=0;i<10;i++){mons.push({x:500+Math.random()*2200,y:500+Math.random()*2200,hp:50,alive:true});}
log('Mundo: '+objs.length+' objs, '+mons.length+' mons');
}

const cv=document.getElementById('game');
const ctx=cv.getContext('2d');

function drawSimple(){
ctx.fillStyle='#3a7a3a'; ctx.fillRect(0,0,cv.width,cv.height);
// grid
ctx.strokeStyle='rgba(0,0,0,0.1)'; ctx.lineWidth=1;
let tile=64;
for(let x=-(C.x%tile);x<cv.width;x+=tile){ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,cv.height);ctx.stroke();}
for(let y=-(C.y%tile);y<cv.height;y+=tile){ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(cv.width,y);ctx.stroke();}
// objs
objs.forEach(o=>{
let x=o.x-C.x,y=o.y-C.y;
if(x<-100||x>520||y<-100||y>960) return;
if(o.t==='house'){ctx.fillStyle='#8d6e63'; ctx.fillRect(x-40,y-40,80,70); ctx.fillStyle='#5d4037'; ctx.fillRect(x-40,y-60,80,25); ctx.strokeStyle='#000'; ctx.lineWidth=4; ctx.strokeRect(x-40,y-40,80,70); ctx.strokeRect(x-40,y-60,80,25);}
else {ctx.fillStyle='#2a5a2a'; ctx.beginPath(); ctx.arc(x,y,20,0,6.28); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke();}
});
mons.forEach(m=>{
if(!m.alive) return;
let x=m.x-C.x,y=m.y-C.y;
if(x<-50||x>470||y<-50||y>910) return;
ctx.fillStyle='#4a2a2a'; ctx.beginPath(); ctx.arc(x,y,18,0,6.28); ctx.fill();
ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke();
ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x-5,y-4,4,0,6.28); ctx.arc(x+5,y-4,4,0,6.28); ctx.fill();
});
// player
let px=P.x-C.x,py=P.y-C.y;
ctx.fillStyle='#ffdbac'; ctx.beginPath(); ctx.arc(px,py-12,12,0,6.28); ctx.fill(); ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.stroke();
ctx.fillStyle='#5d4037'; ctx.fillRect(px-12,py-4,24,18); ctx.strokeStyle='#000'; ctx.lineWidth=3; ctx.strokeRect(px-12,py-4,24,18);
if(P.atk>0){ctx.fillStyle='#aaa'; ctx.fillRect(px+12,py-4,24,6);}
else {ctx.fillStyle='#aaa'; ctx.fillRect(px+12,py-2,20,5);}
if(T){let x=T.x-C.x,y=T.y-C.y; ctx.strokeStyle='#FFD700'; ctx.lineWidth=4; ctx.setLineDash([8,4]); ctx.beginPath(); ctx.arc(x,y,20,0,6.28); ctx.stroke(); ctx.setLineDash([]);}
}

// JOYSTICK SIMPLES QUE FUNCIONA
let joyBase=document.getElementById('joyBase');
let joyStick=document.getElementById('joyStick');
let joyWrap=document.getElementById('joy');

function getJoy(e){
let cx,cy;
if(e.touches && e.touches[0]){cx=e.touches[0].clientX; cy=e.touches[0].clientY;}
else {cx=e.clientX; cy=e.clientY;}
let r=joyBase.getBoundingClientRect();
let dx=cx-(r.left+r.width/2), dy=cy-(r.top+r.height/2), d=Math.hypot(dx,dy), max=45;
if(d>max){let a=Math.atan2(dy,dx); dx=Math.cos(a)*max; dy=Math.sin(a)*max;}
return {dx,dy};
}

joyWrap.addEventListener('touchstart', (e)=>{
e.preventDefault();
J.a=1; T=null;
let {dx,dy}=getJoy(e);
joyStick.style.transform=`translate(${dx}px,${dy}px)`;
J.x=dx/45; J.y=dy/45;
document.getElementById('status').textContent='JOY ATIVO';
log('JOY START '+J.x.toFixed(2)+','+J.y.toFixed(2));
},{passive:false});

joyWrap.addEventListener('touchmove', (e)=>{
if(!J.a) return;
e.preventDefault();
let {dx,dy}=getJoy(e);
joyStick.style.transform=`translate(${dx}px,${dy}px)`;
J.x=dx/45; J.y=dy/45;
if(Math.abs(J.x)>0.1) P.f=J.x>0?1:-1;
},{passive:false});

joyWrap.addEventListener('touchend', (e)=>{
e.preventDefault();
J.a=0; J.x=0; J.y=0;
joyStick.style.transform='translate(0,0)';
document.getElementById('status').textContent='PARADO';
log('JOY END');
},{passive:false});

// MOUSE FOR TEST
joyWrap.addEventListener('mousedown', (e)=>{
J.a=1; T=null;
let {dx,dy}=getJoy(e);
joyStick.style.transform=`translate(${dx}px,${dy}px)`;
J.x=dx/45; J.y=dy/45;
});
window.addEventListener('mousemove', (e)=>{
if(!J.a) return;
let {dx,dy}=getJoy(e);
joyStick.style.transform=`translate(${dx}px,${dy}px)`;
J.x=dx/45; J.y=dy/45;
});
window.addEventListener('mouseup', ()=>{
J.a=0; J.x=0; J.y=0;
joyStick.style.transform='translate(0,0)';
});

// MAP TAP
cv.addEventListener('touchstart', (e)=>{
if(J.a) return;
if(e.touches.length!==1) return;
let t=e.touches[0];
if(t.clientX<180 && t.clientY>window.innerHeight-200) return;
if(t.clientX>window.innerWidth-120 && t.clientY>window.innerHeight-200) return;
e.preventDefault();
let r=cv.getBoundingClientRect();
let x=(t.clientX-r.left)*(cv.width/r.width), y=(t.clientY-r.top)*(cv.height/r.height);
T={x:C.x+x, y:C.y+y};
log('TAP MAP '+Math.floor(T.x)+','+Math.floor(T.y));
},{passive:false});

cv.addEventListener('click', (e)=>{
let r=cv.getBoundingClientRect();
let x=(e.clientX-r.left)*(cv.width/r.width), y=(e.clientY-r.top)*(cv.height/r.width);
T={x:C.x+x, y:C.y+y};
log('CLICK MAP');
});

// ATTACK
document.getElementById('atk').addEventListener('touchstart', (e)=>{
e.preventDefault();
P.atk=12;
P.gold+=5;
document.getElementById('gold').textContent=P.gold;
log('ATAQUE! Gold '+P.gold);
mons.forEach(m=>{
if(!m.alive) return;
if(Math.hypot(m.x-P.x,m.y-P.y)<100){m.hp-=30; if(m.hp<=0){m.alive=false; setTimeout(()=>{m.alive=true; m.hp=50;},3000);} }
});
},{passive:false});
document.getElementById('atk').addEventListener('click', ()=>{
P.atk=12; P.gold+=5; document.getElementById('gold').textContent=P.gold; log('ATAQUE CLICK');
});

// START - SIMPLES E COM TRY CATCH
function startV8(){
try{
log('START V8 CLICADO!');
P.x=W/2; P.y=H/2;
genWorldSimple();
let s=document.getElementById('start');
if(s){s.style.display='none'; s.remove(); log('MENU REMOVIDO DO DOM');}
else {log('ERRO: start não achado');}
if(!gameOn){
gameOn=true;
log('INICIANDO LOOP...');
requestAnimationFrame(loop);
}
document.getElementById('status').textContent='JOGANDO!';
log('JOGO INICIADO - ARRASTE JOYSTICK');
}catch(err){
log('ERRO START: '+err.message+' '+err.stack);
alert('ERRO: '+err.message);
}
}

// LOOP SIMPLES
let last=performance.now();
function loop(now){
try{
let dt=Math.min((now-last)/1000,0.05); last=now;
let mx=0,my=0;
if(J.a){mx=J.x; my=J.y;}
else if(T){let dx=T.x-P.x, dy=T.y-P.y, d=Math.hypot(dx,dy); if(d<25){T=null;} else {mx=dx/d; my=dy/d;}}
if(mx||my){
P.x+=mx*200*dt;
P.y+=my*200*dt;
P.x=Math.max(0,Math.min(W,P.x));
P.y=Math.max(0,Math.min(H,P.y));
}
if(P.atk>0) P.atk--;
C.x=P.x-cv.width/2; C.y=P.y-cv.height/2;
C.x=Math.max(0,Math.min(W-cv.width,C.x)); C.y=Math.max(0,Math.min(H-cv.height,C.y));
drawSimple();
document.getElementById('pos').textContent=Math.floor(P.x/100)+','+Math.floor(P.y/100);
}catch(err){
log('ERRO LOOP: '+err.message);
}
requestAnimationFrame(loop);
}

genWorldSimple();
drawSimple();
log('V8 PRONTO - CLIQUE JOGAR');
</script>
</body>
</html>
