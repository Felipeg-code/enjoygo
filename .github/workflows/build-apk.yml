name: Build APK - NORRATH CLASH NATIVO

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Prebuild Android Clean
        run: |
          rm -rf android
          npx expo prebuild --platform android --clean

      - name: Bundle JS NATIVO (fix Metro)
        run: |
          mkdir -p android/app/src/main/assets
          mkdir -p android/app/src/main/res
          echo "Gerando bundle nativo..."
          npx react-native bundle \
            --platform android \
            --dev false \
            --entry-file node_modules/expo/AppEntry.js \
            --bundle-output android/app/src/main/assets/index.android.bundle \
            --assets-dest android/app/src/main/res/ \
            --verbose
          ls -lh android/app/src/main/assets/
          echo "Bundle size:"
          du -h android/app/src/main/assets/index.android.bundle || true
          # fallback: expo export embed
          if [ ! -f android/app/src/main/assets/index.android.bundle ]; then
            echo "Fallback expo export:embed"
            npx expo export:embed --platform android --dev false || true
            ls -lh android/app/src/main/assets/ || true
          fi

      - name: Build APK Debug Nativo
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace
          ls -lh app/build/outputs/apk/debug/

      - name: Verify APK has bundle
        run: |
          python3 -c "
          import zipfile
          apk='android/app/build/outputs/apk/debug/app-debug.apk'
          with zipfile.ZipFile(apk) as z:
              has='assets/index.android.bundle' in z.namelist()
              print(f'HAS BUNDLE: {has}')
              if has:
                  info=z.getinfo('assets/index.android.bundle')
                  print(f'Bundle size in APK: {info.file_size/1024/1024:.2f} MB')
              else:
                  print('FILES:', [f for f in z.namelist() if 'assets' in f][:20])
          "

      - name: Upload APK NATIVO
        uses: actions/upload-artifact@v4
        with:
          name: NORRATH-CLASH-NATIVO-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release NATIVO
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vNATIVO-${{ github.run_number }}
          name: ✅ NORRATH CLASH NATIVO v${{ github.run_number }} - 100% Offline
          body: |
            🎮 **NORRATH CLASH - APK 100% NATIVO - SEM METRO!**
            
            ✅ **CORRIGIDO:** Bundle nativo incluso, roda 100% offline!
            ✅ Motor NORRATH-1 + 24 texturas + Lv20 1 dia + Paragon infinito
            ✅ 5 Atos + Dungeons + Loja + Gemas + Colisões
            
            📱 **INSTALAR:**
            1. Baixe app-debug.apk
            2. Permita fontes desconhecidas
            3. Jogue offline!
            
            🌐 WEB: https://felipeg-code.github.io/enjoygo/norrath-clash.html
            
            Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
