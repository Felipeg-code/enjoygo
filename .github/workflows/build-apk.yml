name: Build APK - enjoygo FINAL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Check Android SDK
        run: |
          echo "ANDROID_HOME: $ANDROID_HOME"
          echo "ANDROID_SDK_ROOT: $ANDROID_SDK_ROOT"
          ls -la $ANDROID_HOME || true
          sdkmanager --list | head -n 20 || true

      - name: Expo Prebuild clean
        run: |
          npx expo prebuild --platform android --clean --no-install || echo "prebuild skip"

      - name: Build APK Debug
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --info
        continue-on-error: false

      - name: List APKs
        run: |
          find android -name "*.apk" -type f -exec ls -lh {} \;
          ls -lh android/app/build/outputs/apk/debug/ || true

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: enjoygo-FINAL-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release FINAL
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vFINAL-${{ github.run_number }}
          name: 🏪💎 enjoygo FINAL v${{ github.run_number }}
          body: |
            🎮 **ENJOYGO FINAL - Champions × Clash**
            
            ✅ Loja com Mercador + 8 Gemas 4 Slots + 5 Atos + Dungeons + Colisões
            
            📱 **INSTALAR:**
            1. Baixe app-debug.apk abaixo
            2. Abra no Android, permita fontes desconhecidas
            3. Jogue!
            
            🌐 **WEB:** https://felipeg-code.github.io/enjoygo/enjoygo-final.html
            
            Build ${{ github.run_number }}
          files: android/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
