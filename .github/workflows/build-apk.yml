name: Build APK - enjoygo FINAL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Expo Prebuild (clean)
        run: |
          npx expo prebuild --platform android --clean --no-install || echo "prebuild failed, continuing with existing android folder"

      - name: Build APK Debug (no signing needed)
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Build APK Release (unsigned)
        run: |
          cd android
          ./gradlew assembleRelease --no-daemon || echo "release build failed, using debug"

      - name: Find APK
        run: |
          find android/app/build/outputs -name "*.apk" -type f
          ls -lh android/app/build/outputs/apk/debug/ || true
          ls -lh android/app/build/outputs/apk/release/ || true

      - name: Upload APK Debug
        uses: actions/upload-artifact@v4
        with:
          name: enjoygo-apk-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload APK Release
        uses: actions/upload-artifact@v4
        with:
          name: enjoygo-apk-release
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          retention-days: 30
          if-no-files-found: warn

      - name: Upload any APK found
        uses: actions/upload-artifact@v4
        with:
          name: enjoygo-apk-FINAL
          path: android/app/build/outputs/apk/**/*.apk
          retention-days: 30
          if-no-files-found: error

      - name: Create Release FINAL
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vFINAL-${{ github.run_number }}
          name: 🏪💎 enjoygo FINAL v${{ github.run_number }} - Loja + Gemas 4 Slots
          body: |
            🎮 **ENJOYGO FINAL - Champions of Norrath × Clash of Clans**
            
            ✅ **TUDO IMPLEMENTADO:**
            - 🏪 Loja com Mercador NPC
            - 💎 8 tipos de gemas - 4 slots por item
            - ⚔️ 5 Atos - Faydark, Caverna, Deserto, Formigueiro, Cidade Dark Elf
            - 🗺️ Dungeons aleatórias com colisões reais
            - 📜 12 missões com progresso
            - 🎒 Inventário com peso + visual muda com roupa/arma
            - 🧙 5 classes + skill tree ramificada
            - 👹 Boss de cada ato + Boss final
            - 🎁 Loot prefix/suffix 1000+ variações
            - 🕹️ Joystick 150px + botões 68px - 100% mobile
            
            📱 **INSTALAR NO CELULAR:**
            1. Baixe o APK abaixo (app-debug.apk)
            2. No celular, abra o arquivo
            3. Permita instalar de fontes desconhecidas
            4. Jogue! Funciona offline (carrega do GitHub Pages quando online)
            
            🌐 **JOGAR NO NAVEGADOR:**
            https://felipeg-code.github.io/enjoygo/enjoygo-final.html
            
            🔧 Build: ${{ github.run_number }} | ${{ github.sha }}
          files: |
            android/app/build/outputs/apk/debug/app-debug.apk
            android/app/build/outputs/apk/release/app-release-unsigned.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
