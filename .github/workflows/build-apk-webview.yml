name: Build APK WebView 100% Offline - JOGO REAL

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create WebView APK Project - JOGO DIRETO
        run: |
          mkdir -p webview-apk/app/src/main/java/com/norrathclash
          mkdir -p webview-apk/app/src/main/assets
          mkdir -p webview-apk/app/src/main/res/values
          
          cp norrath-clash.html webview-apk/app/src/main/assets/ 2>/dev/null || true
          ls -lh webview-apk/app/src/main/assets/
          echo "HTML size: $(wc -c < webview-apk/app/src/main/assets/norrath-clash.html) bytes - deve ser 109KB+"
          
          cat > webview-apk/settings.gradle << 'GRADLE'
          include ':app'
          GRADLE
          
          cat > webview-apk/gradle.properties << 'GRADLE'
          android.useAndroidX=true
          android.enableJetifier=true
          org.gradle.jvmargs=-Xmx4g
          GRADLE
          
          cat > webview-apk/build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          
          cat > webview-apk/app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.norrathclash'
            compileSdk 34
            defaultConfig {
              applicationId "com.norrathclash"
              minSdk 21
              targetSdk 34
              versionCode 4
              versionName "4.0-V2-JOGO-REAL"
            }
            buildTypes {
              release { minifyEnabled false; shrinkResources false }
              debug { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          GRADLE
          
          cat > webview-apk/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <uses-permission android:name="android.permission.INTERNET" />
            <uses-permission android:name="android.permission.ACCESS_NETWORK_STATE" />
            <application
              android:allowBackup="true"
              android:icon="@android:drawable/sym_def_app_icon"
              android:label="NORRATH CLASH V2"
              android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
              android:hardwareAccelerated="true"
              android:usesCleartextTraffic="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize|keyboardHidden|keyboard">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          
          cat > webview-apk/app/src/main/res/values/strings.xml << 'STRINGS'
          <resources><string name="app_name">NORRATH CLASH V2</string></resources>
          STRINGS
          
          cat > webview-apk/app/src/main/java/com/norrathclash/MainActivity.java << 'JAVA'
          package com.norrathclash;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebChromeClient;
          import android.webkit.WebSettings;
          import android.view.WindowManager;
          import android.util.Log;
          import java.io.InputStream;
          import java.io.IOException;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              
              webView = new WebView(this);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setAllowFileAccess(true);
              ws.setAllowFileAccessFromFileURLs(true);
              ws.setAllowUniversalAccessFromFileURLs(true);
              ws.setAllowContentAccess(true);
              ws.setMediaPlaybackRequiresUserGesture(false);
              ws.setBuiltInZoomControls(false);
              ws.setDisplayZoomControls(false);
              ws.setCacheMode(WebSettings.LOAD_NO_CACHE);
              ws.setMixedContentMode(WebSettings.MIXED_CONTENT_ALWAYS_ALLOW);
              
              webView.setWebViewClient(new WebViewClient());
              webView.setWebChromeClient(new WebChromeClient());
              webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
              
              // METODO 1: Tenta carregar direto do assets via loadDataWithBaseURL (mais confiavel)
              try {
                InputStream is = getAssets().open("norrath-clash.html");
                byte[] buffer = new byte[is.available()];
                is.read(buffer);
                is.close();
                String html = new String(buffer, "UTF-8");
                Log.d("NORRATH", "HTML loaded: " + html.length() + " chars");
                // Carrega HTML com base URL file:///android_asset/ para permitir recursos relativos
                webView.loadDataWithBaseURL("file:///android_asset/", html, "text/html", "UTF-8", null);
              } catch (IOException e) {
                Log.e("NORRATH", "Erro ao ler HTML: " + e.getMessage());
                // Fallback: tenta loadUrl
                webView.loadUrl("file:///android_asset/norrath-clash.html");
              }
              
              setContentView(webView);
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
            @Override
            protected void onDestroy() {
              if (webView != null) {
                webView.destroy();
              }
              super.onDestroy();
            }
          }
          JAVA
          
          echo "MainActivity criada com loadDataWithBaseURL - JOGO REAL:"
          cat webview-apk/app/src/main/java/com/norrathclash/MainActivity.java
          
      - name: Build APK - JOGO REAL 100% OFFLINE
        run: |
          cd webview-apk
          gradle wrapper --gradle-version 8.5 || true
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon --stacktrace
          else
            gradle assembleDebug --no-daemon --stacktrace
          fi
          ls -lh app/build/outputs/apk/debug/ || find . -name "*.apk" -type f -exec ls -lh {} \;
          python3 -c "
          import zipfile, os, glob
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if not os.path.exists(apk):
              apks=glob.glob('**/*.apk', recursive=True)
              print(f'Found APKs: {apks}')
              if apks:
                  apk=apks[0]
          print(f'APK: {apk} - {os.path.getsize(apk)} bytes')
          with zipfile.ZipFile(apk) as z:
              files=z.namelist()
              has_html='assets/norrath-clash.html' in files
              print(f'HAS HTML: {has_html}')
              if has_html:
                  info=z.getinfo('assets/norrath-clash.html')
                  print(f'HTML size in APK: {info.file_size} bytes')
                  html=z.read('assets/norrath-clash.html').decode('utf-8')
                  print(f'Contains game canvas: {\"<canvas\" in html}')
                  print(f'Contains NORRATH: {\"NORRATH CLASH\" in html}')
                  print(f'Contains V2: {\"V2\" in html}')
              # Check MainActivity
              has_main='classes.dex' in files
              print(f'HAS CLASSES.DEX: {has_main}')
          "

      - name: Upload APK JOGO REAL
        uses: actions/upload-artifact@v4
        with:
          name: NORRATH-CLASH-V2-JOGO-REAL-APK
          path: webview-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release JOGO REAL
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vJOGO-REAL-${{ github.run_number }}
          name: 🎮 NORRATH CLASH V2 - JOGO REAL v${{ github.run_number }} - 100% OFFLINE
          body: |
            🎮 **APK JOGO REAL - RODA O JOGO DIRETO, SEM INTERNET, SEM METRO!**
            
            ✅ **O JOGO MESMO DENTRO DO APK:**
            - HTML 109KB V2 com motor NORRATH-1, 24 texturas, 5 atos, dungeons, boss
            - Minimapa + Craft Gemas + Torre 100 + Save Auto + Visual Equip
            - Carrega via loadDataWithBaseURL de assets/norrath-clash.html
            - 100% offline, sem internet, sem Metro, sem bundle!
            - MainActivity.java lê HTML de assets e injeta no WebView
            
            📱 **INSTALAR E JOGAR:**
            1. Baixe app-debug.apk (3MB)
            2. Instale no Android (permita fontes desconhecidas)
            3. Abra - o jogo roda direto!
            4. Sem precisar conectar nada!
            
            🌐 WEB (mesmo jogo): https://felipeg-code.github.io/enjoygo/norrath-clash.html
            
            Build ${{ github.run_number }} - JOGO REAL 100% OFFLINE
          files: webview-apk/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
