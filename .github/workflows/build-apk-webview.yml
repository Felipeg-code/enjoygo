name: Build APK WebView 100% Offline

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build-webview-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Create WebView APK Project
        run: |
          mkdir -p webview-apk/app/src/main/java/com/norrathclash
          mkdir -p webview-apk/app/src/main/assets
          mkdir -p webview-apk/app/src/main/res/values
          
          # Copy game HTML
          cp norrath-clash.html webview-apk/app/src/main/assets/ 2>/dev/null || cp enjoygo/norrath-clash.html webview-apk/app/src/main/assets/ 2>/dev/null || true
          if [ ! -f webview-apk/app/src/main/assets/norrath-clash.html ]; then
            echo "Trying to find HTML..."
            find . -name "norrath-clash.html" -type f | head -n 5
            find . -name "*.html" | grep norrath | head -n 5
            # Create from base64 if needed - fallback
            ls -lh .
          fi
          ls -lh webview-apk/app/src/main/assets/
          
          cat > webview-apk/settings.gradle << 'GRADLE'
          include ':app'
          GRADLE
          
          cat > webview-apk/build.gradle << 'GRADLE'
          buildscript {
            repositories { google(); mavenCentral() }
            dependencies { classpath 'com.android.tools.build:gradle:8.2.2' }
          }
          allprojects { repositories { google(); mavenCentral() } }
          GRADLE
          
          cat > webview-apk/app/build.gradle << 'GRADLE'
          plugins { id 'com.android.application' }
          android {
            namespace 'com.norrathclash'
            compileSdk 34
            defaultConfig {
              applicationId "com.norrathclash"
              minSdk 21
              targetSdk 34
              versionCode 2
              versionName "2.0-V2-NATIVO"
            }
            buildTypes {
              release { minifyEnabled false; shrinkResources false }
              debug { minifyEnabled false }
            }
            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }
          dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.webkit:webkit:1.9.0'
          }
          GRADLE
          
          cat > webview-apk/app/src/main/AndroidManifest.xml << 'MANIFEST'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
              android:allowBackup="true"
              android:icon="@android:drawable/sym_def_app_icon"
              android:label="NORRATH CLASH V2"
              android:theme="@android:style/Theme.NoTitleBar.Fullscreen"
              android:hardwareAccelerated="true">
              <activity
                android:name=".MainActivity"
                android:exported="true"
                android:screenOrientation="portrait"
                android:configChanges="orientation|screenSize|keyboardHidden">
                <intent-filter>
                  <action android:name="android.intent.action.MAIN" />
                  <category android:name="android.intent.category.LAUNCHER" />
                </intent-filter>
              </activity>
            </application>
          </manifest>
          MANIFEST
          
          cat > webview-apk/app/src/main/res/values/strings.xml << 'STRINGS'
          <resources><string name="app_name">NORRATH CLASH V2</string></resources>
          STRINGS
          
          cat > webview-apk/app/src/main/java/com/norrathclash/MainActivity.java << 'JAVA'
          package com.norrathclash;
          import android.app.Activity;
          import android.os.Bundle;
          import android.webkit.WebView;
          import android.webkit.WebViewClient;
          import android.webkit.WebSettings;
          import android.view.WindowManager;
          public class MainActivity extends Activity {
            private WebView webView;
            @Override
            protected void onCreate(Bundle savedInstanceState) {
              super.onCreate(savedInstanceState);
              getWindow().setFlags(WindowManager.LayoutParams.FLAG_FULLSCREEN, WindowManager.LayoutParams.FLAG_FULLSCREEN);
              getWindow().addFlags(WindowManager.LayoutParams.FLAG_KEEP_SCREEN_ON);
              webView = new WebView(this);
              WebSettings ws = webView.getSettings();
              ws.setJavaScriptEnabled(true);
              ws.setDomStorageEnabled(true);
              ws.setAllowFileAccess(true);
              ws.setAllowFileAccessFromFileURLs(true);
              ws.setAllowUniversalAccessFromFileURLs(true);
              ws.setMediaPlaybackRequiresUserGesture(false);
              ws.setBuiltInZoomControls(false);
              ws.setDisplayZoomControls(false);
              webView.setWebViewClient(new WebViewClient());
              webView.setOverScrollMode(WebView.OVER_SCROLL_NEVER);
              webView.loadUrl("file:///android_asset/norrath-clash.html");
              setContentView(webView);
            }
            @Override
            public void onBackPressed() {
              if (webView.canGoBack()) webView.goBack();
              else super.onBackPressed();
            }
          }
          JAVA
          
      - name: Build APK with Gradle
        run: |
          cd webview-apk
          gradle wrapper --gradle-version 8.5 || echo "wrapper fail, trying with gradle directly"
          chmod +x gradlew || true
          if [ -f gradlew ]; then
            ./gradlew assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace
          else
            gradle assembleDebug --no-daemon -Dorg.gradle.jvmargs="-Xmx4g" --stacktrace || /opt/gradle/bin/gradle assembleDebug --no-daemon || gradle-8.5/bin/gradle assembleDebug
          fi
          ls -lh app/build/outputs/apk/debug/ || find . -name "*.apk" -type f
          python3 -c "
          import zipfile, os
          apk='app/build/outputs/apk/debug/app-debug.apk'
          if not os.path.exists(apk):
              import glob
              apks=glob.glob('**/*.apk', recursive=True)
              print(f'Found APKs: {apks}')
              if apks:
                  apk=apks[0]
          with zipfile.ZipFile(apk) as z:
              files=z.namelist()
              has_html='assets/norrath-clash.html' in files
              print(f'HAS HTML: {has_html}')
              if has_html:
                  info=z.getinfo('assets/norrath-clash.html')
                  print(f'HTML size: {info.file_size} bytes')
              print(f'Total files: {len(files)}')
          "

      - name: Upload APK WebView
        uses: actions/upload-artifact@v4
        with:
          name: NORRATH-CLASH-V2-WEBVIEW-APK
          path: webview-apk/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

      - name: Create Release WebView
        if: success()
        uses: softprops/action-gh-release@v1
        with:
          tag_name: vWEBVIEW-${{ github.run_number }}
          name: ✅ NORRATH CLASH V2 WEBVIEW v${{ github.run_number }} - 100% OFFLINE SEM METRO
          body: |
            🎮 **NORRATH CLASH V2 - APK WEBVIEW 100% NATIVO - SEM METRO!**
            
            ✅ **RESOLVIDO DEFINITIVO:** APK puro WebView, sem React Native, sem Metro!
            ✅ Carrega HTML direto de assets, 100% offline!
            ✅ V2: Minimapa + Craft Gemas + Torre 100 + Save Auto + Visual Equip
            
            📱 **INSTALAR (AGORA VAI!):**
            1. Baixe app-debug.apk
            2. Permita fontes desconhecidas
            3. Jogue! Sem Metro!
            
            🌐 WEB: https://felipeg-code.github.io/enjoygo/norrath-clash.html
            
            Build ${{ github.run_number }}
          files: webview-apk/app/build/outputs/apk/debug/app-debug.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
